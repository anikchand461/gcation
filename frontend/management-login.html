<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d0b36">
<title>Management Login | G-CATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="apple-touch-icon" href="assets/logo-mark.png">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('gc-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<!-- Vercel Web Analytics (served by Vercel; not available when running locally) -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true"><div class="splash-inner"><img src="assets/logo-mark.png" alt="" width="96" height="96"><div class="splash-name">G<span>-CATION</span></div><div class="splash-bar"><span></span></div></div></div>
<div class="auth">
  <aside class="auth-side">
    <a class="brand" href="/"><img class="logo" src="assets/logo-mark.png" alt="" width="36" height="36">G<span>-CATION</span> <span class="tag" style="background:#fff;color:#140f2e">TEAM</span></a>
    <div>
      <h2>Bring students to G-CATION.</h2>
      <p>See every course and its price, and share your Management ID so the students you refer are counted for you.</p>
      <ul class="auth-points" id="points"></ul>
    </div>
    <small style="color:#bba6d9">For the G-CATION management team.</small>
  </aside>

  <main class="auth-main">
    <div class="top">
      <a class="brand mobile-brand" href="/"><img class="logo" src="assets/logo-mark.png" alt="" width="36" height="36">G<span>-CATION</span></a>
      <div class="row" style="margin-left:auto;gap:8px"><button class="icon-btn theme-btn" type="button" data-theme-toggle></button><a class="btn ghost sm" href="/">← Home</a></div>
    </div>
    <div class="card auth-box" id="authBox"></div>
    <p class="center tiny muted">Are you a student? <a href="login.html" style="color:var(--purple);font-weight:700">Student login</a></p>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
const AUTH = { role: 'management', home: 'management.html' };
document.getElementById('points').innerHTML = [
  'All courses with their prices',
  'Your own Management ID to share',
  'Students enter it as their Referral ID',
].map(t => `<li>${icon('checkCircle')} ${t}</li>`).join('');
</script>
<script src="js/auth.js"></script>
</body>
</html>
