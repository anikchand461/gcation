<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f3fd">
<title>My Dashboard | G-CATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app has-tabbar">
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" href="/">G<span>-CATION</span></a>
    <a class="nav-item" href="#/home" data-route="home" data-icon="home">Home</a>
    <a class="nav-item" href="#/courses" data-route="courses" data-icon="graduation">My courses</a>
    <a class="nav-item" href="#/updates" data-route="updates" data-icon="megaphone">Updates <span class="count" id="navUnread" hidden></span></a>
    <a class="nav-item" href="#/profile" data-route="profile" data-icon="user">Profile</a>
    <div class="sidebar-foot">
      <div class="user-card"><span class="avatar-sm" id="sideAvatar"></span><div><b id="sideName">…</b><small id="sideEmail"></small></div></div>
      <button class="btn outline block sm" id="logoutBtn"></button>
    </div>
  </aside>
  <div class="scrim"></div>

  <div class="main">
    <header class="topbar">
      <a class="brand" href="#/home">G<span>-CATION</span></a>
      <div class="row" style="gap:8px">
        <a class="icon-btn" href="#/updates" id="bellBtn" aria-label="Updates"></a>
        <a href="#/profile" class="avatar-sm" id="topAvatar" aria-label="Profile"></a>
      </div>
    </header>
    <div class="content"><div id="view">
      <div class="skeleton" style="height:150px;margin-bottom:18px"></div>
      <div class="skeleton" style="height:240px"></div>
    </div></div>
  </div>

  <nav class="tabbar" aria-label="Main navigation">
    <a href="#/home" data-route="home" data-icon="home">Home</a>
    <a href="#/courses" data-route="courses" data-icon="graduation">Courses</a>
    <a href="#/updates" data-route="updates" data-icon="megaphone">Updates</a>
    <a href="#/profile" data-route="profile" data-icon="user">Profile</a>
  </nav>
</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
