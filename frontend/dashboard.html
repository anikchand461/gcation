<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f4fc">
<title>My Dashboard | G-CATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="apple-touch-icon" href="assets/logo-mark.png">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('gc-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<!-- Vercel Web Analytics (served by Vercel; not available when running locally) -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="splash" id="splash" data-manual aria-hidden="true"><div class="splash-inner"><img src="assets/logo-mark.png" alt="" width="96" height="96"><div class="splash-name">G<span>-CATION</span></div><div class="splash-bar"><span></span></div></div></div>
<div class="app has-tabbar">
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" href="/"><img class="logo" src="assets/logo-mark.png" alt="" width="36" height="36">G<span>-CATION</span></a>
    <a class="nav-item" href="#/home" data-route="home" data-icon="home">Home</a>
    <a class="nav-item" href="#/courses" data-route="courses" data-icon="graduation">My courses</a>
    <a class="nav-item" href="#/updates" data-route="updates" data-icon="megaphone">Updates <span class="count" id="navUnread" hidden></span></a>
    <a class="nav-item" href="#/profile" data-route="profile" data-icon="user">Profile</a>
    <div class="sidebar-foot">
      <div class="user-card"><span class="avatar-sm" id="sideAvatar"></span><div><b id="sideName">…</b><small id="sideEmail"></small></div></div>
      <button class="icon-btn theme-btn" type="button" data-theme-toggle="label"></button>
      <button class="btn outline block sm" id="logoutBtn"></button>
    </div>
  </aside>
  <div class="scrim"></div>

  <div class="main">
    <header class="topbar">
      <a class="brand" href="#/home"><img class="logo" src="assets/logo-mark.png" alt="" width="36" height="36">G<span>-CATION</span></a>
      <div class="row" style="gap:8px">
        <button class="icon-btn theme-btn" type="button" data-theme-toggle></button>
        <a class="icon-btn" href="#/updates" id="bellBtn" aria-label="Updates"></a>
        <a href="#/profile" class="avatar-sm" id="topAvatar" aria-label="Profile"></a>
      </div>
    </header>
    <div class="content"><div id="view">
      <div class="skeleton" style="height:150px;margin-bottom:18px"></div>
      <div class="skeleton" style="height:240px"></div>
    </div></div>
  </div>

  <nav class="tabbar" aria-label="Main navigation">
    <a href="#/home" data-route="home" data-icon="home">Home</a>
    <a href="#/courses" data-route="courses" data-icon="graduation">Courses</a>
    <a href="#/updates" data-route="updates" data-icon="megaphone">Updates</a>
    <a href="#/profile" data-route="profile" data-icon="user">Profile</a>
  </nav>
</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
